[phases.setup]
nixPkgs = ["python312", "poetry", "ffmpeg"]

[phases.install]
cmds = ["cd apps/api && poetry install --no-root --only main"]

[phases.build]
cmds = []

# API server — used by the main Railway service
[start]
cmd = "cd apps/api && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
